<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Voxel Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="blocker">
      <div id="instructions">
        <span style="font-size:36px; font-weight: bold; color: #4ade80;">Voxel Web Game</span><br/><br/>
        <span style="font-size:24px">Click to play</span>
        <br /><br />
        Move: WASD<br/>
        Jump: SPACE<br/>
        Look: Mouse<br/>
        Place Block: Right Click<br/>
        Break Block: Left Click
      </div>
    </div>
    <div id="crosshair">+</div>
    <div id="mobile-controls" style="display: none;">
      <div id="joystick-zone"></div>
      <div id="action-buttons">
        <div class="mobile-btn" id="btn-color">🎨 Color</div>
        <div class="mobile-btn" id="btn-jump">⬆️ Jump</div>
        <div class="mobile-btn" id="btn-break">🔨 Break</div>
        <div class="mobile-btn" id="btn-place">🧱 Place</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
